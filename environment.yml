# ============================================================
# upf-neurocog — Conda environment specification
# Usage:
#   conda env create -f environment.yml
#   conda activate upf-neurocog
# ============================================================

name: upf-neurocog

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python runtime ──────────────────────────────────────────
  - python=3.11

  # ── Core data ───────────────────────────────────────────────
  - pandas=2.3.3
  - numpy=1.26.4

  # ── Statistics ──────────────────────────────────────────────
  - scipy=1.14.1
  - statsmodels=0.15.0

  # ── Machine learning ────────────────────────────────────────
  - scikit-learn=1.7.2
  - xgboost=3.2.0

  # ── Visualisation ───────────────────────────────────────────
  - matplotlib=3.9.2
  - seaborn=0.12.2

  # ── Notebook / dev tools ────────────────────────────────────
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - ipywidgets>=8.0

  # ── Pip-only packages ───────────────────────────────────────
  - pip
  - pip:
    - shap==0.49.1

# ── Environment variables (set in your shell before running) ──
# export OMP_NUM_THREADS=1
# export MKL_NUM_THREADS=1
# export OPENBLAS_NUM_THREADS=1
