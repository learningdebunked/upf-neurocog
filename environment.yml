name: upf-neurocog-v2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyarrow>=12.0        # parquet I/O
  - openpyxl>=3.1        # USDA Excel files
  - requests>=2.31
  - tqdm>=4.65
  - joblib>=1.3
  - statsmodels>=0.14
  - pip:
      - xgboost>=2.0
      - shap>=0.43
      - mne>=1.6           # EEG processing (DEAP pipeline)
      - pyreadstat>=1.2    # SAS XPT reader
      - openai>=1.3        # LLM NOVA classifier (optional)
      - transformers>=4.35 # HuggingFace NOVA classifier (optional)
      - torch>=2.1         # HuggingFace backend (optional; CPU-only)
      - geopandas>=0.14    # SDOH geo join (optional)
