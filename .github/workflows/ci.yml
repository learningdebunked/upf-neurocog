name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

jobs:

  # ── Lint & static checks ───────────────────────────────────────────────
  lint:
    name: Lint (flake8 + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install flake8 isort
      - name: flake8
        run: flake8 analysis/ --max-line-length=120 --ignore=E203,W503
      - name: isort check
        run: isort --check-only analysis/

  # ── Unit tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow pyreadstat \
                      xgboost shap mne matplotlib seaborn openpyxl tqdm pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: analysis

  # ── Dry-run pipeline (smoke test, no real data) ────────────────────────
  smoke:
    name: Smoke Test (stub data)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --no-deps 2>/dev/null || \
          pip install numpy pandas scipy scikit-learn pyarrow pyreadstat \
                      xgboost shap mne matplotlib seaborn openpyxl tqdm
      - name: Smoke-test NOVA rule-based classifier
        run: |
          cd analysis
          python -c "
          from nova_llm_classifier import NOVAClassifier
          clf = NOVAClassifier(backend='rule')
          foods = ['Whole grain bread', 'Coca-Cola', 'Apple', 'Instant noodles']
          results = clf.classify_batch(foods)
          for name, cat in zip(foods, results):
              print(f'{name}: NOVA {cat}')
          "
      - name: Smoke-test integration pipeline (empty stub)
        run: |
          cd analysis
          python -c "
          import pandas as pd, os
          from pathlib import Path
          Path('data').mkdir(exist_ok=True)
          # Minimal stub cohort
          df = pd.DataFrame({
              'upf_energy_pct': [30.0, 15.0, 50.0],
              'age_years':      [35,    45,    55],
              'brfss_poor_mh_days': [5, 2, 12],
              'brfss_sleep_insufficient': [1, 0, 1],
              'brfss_inactive':  [0, 1, 1],
              'cognitive_risk_label': [1, 0, 1],
          })
          df.to_parquet('data/integrated_cohort.parquet', index=False)
          print('Stub cohort written — pipeline smoke-test passed.')
          "
